name: Test

on:
  pull_request

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@v3
        with:
          node-version: 19
      - run: yarn install --frozen-lockfile
      - run: yarn lint && yarn test
