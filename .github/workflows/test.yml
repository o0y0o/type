name: Test

on:
  pull_request

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@v3
        with:
          node-version: 19
      - run: yarn install --frozen-lockfile
      - run: yarn lint && yarn test
