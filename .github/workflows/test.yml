name: Test

on:
  pull_request

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@v3
        with:
          node-version: 19
      - run: yarn install --frozen-lockfile
      - run: yarn lint && yarn test
